<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · Fort Bragg Local</title>
<meta name="theme-color" content="#1d3b2f">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f3ec; --ink: #18201c; --muted: #4c5751; --card: #ffffff; --line: #dcd6c8;
    --brand: #1f4a37; --brand-ink: #ffffff; --accent: #8a5a12; --focus: #2f6fd6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1512; --ink: #eeebe3; --muted: #b5bcb6; --card: #18211c; --line: #2f3a33;
      --brand: #8fd4ae; --brand-ink: #0b1810; --accent: #f2c46a; --focus: #8ab4ff; }
  }
  * { box-sizing: border-box; }
  html { font-size: 112.5%; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--bg); color: var(--ink);
    font: 1rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { width: 100%; max-width: 34rem; text-align: center; }
  .mark { width: 72px; height: 72px; margin: 0 auto 1.25rem; display: block; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 600; font-size: clamp(1.9rem, 6vw, 2.6rem); line-height: 1.15; margin: 0 0 .6rem; letter-spacing: -.01em; }
  p { margin: 0 0 1.5rem; color: var(--muted); font-size: 1.1rem; }
  form { display: flex; gap: .5rem; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: .45rem; margin: 0 0 1.25rem; }
  label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  input { flex: 1 1 0%; width: 0; min-width: 0; border: 0; background: transparent; color: inherit; font: inherit; font-size: 1.1rem; padding: .7rem .8rem; }
  input:focus { outline: none; }
  form:focus-within { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 30%, transparent); }
  button, .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-height: 52px; padding: 0 1.3rem;
    border-radius: 13px; border: 0; background: var(--brand); color: var(--brand-ink); font: inherit; font-weight: 700; font-size: 1.05rem;
    text-decoration: none; cursor: pointer;
  }
  .btn-quiet { background: transparent; color: var(--ink); border: 2px solid var(--line); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .links { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#1f4a37"/><circle cx="29.5" cy="10.5" r="3.2" fill="#e0ac4c"/><path fill="#f7f1e3" d="M20 7.2c3.9 0 7 2.9 7.3 6.6 2.4.9 4 3.1 4 5.7 0 3.4-2.8 6.1-6.2 6.1h-3.4v6.2h-3.4v-6.2h-3.4c-3.4 0-6.2-2.7-6.2-6.1 0-2.6 1.6-4.8 4-5.7.3-3.7 3.4-6.6 7.3-6.6z"/><path d="M9 32.6h22" stroke="#f7f1e3" stroke-width="2" stroke-linecap="round" opacity=".7"/></svg>
  <h1>We couldn’t find that page</h1>
  <p>The link may be old or mistyped. Try searching for what you need instead.</p>
  <form id="f" action="/" method="get" role="search">
    <label for="q">What are you looking for?</label>
    <input id="q" name="q" type="search" placeholder="pizza, dentist, fix my sink…" autocomplete="off" enterkeyhint="search">
    <button type="submit">Search</button>
  </form>
  <div class="links">
    <a class="btn btn-quiet" id="home" href="/">Go to the home page</a>
    <a class="btn btn-quiet" id="list" href="/directory.html">See the full list of businesses</a>
  </div>
</main>
<script>
  // GitHub Pages serves this page for any missing address, at any depth, so work out where the site lives.
  (async () => {
    const parts = location.pathname.split('/').filter(Boolean);
    const tries = [];
    if (/\.github\.io$/i.test(location.hostname) && parts.length) tries.push('/' + parts[0] + '/');
    tries.push('/');
    let base = '/';
    for (const b of tries) {
      try {
        // A plain GET (not HEAD) so the saved offline copy can answer when there's no internet.
        const r = await fetch(b + 'site.webmanifest', { cache: 'no-cache' });
        if (r.ok) { base = b; break; }
      } catch (e) { /* try the next one */ }
    }
    document.getElementById('f').action = base;
    document.getElementById('home').href = base;
    document.getElementById('list').href = base + 'directory.html';

    // A typed address like ".../dentist" or ".../pizza-delivery" becomes a search.
    const rest = location.pathname.slice(base.length).replace(/\/+$/, '');
    let words = '';
    try { words = decodeURIComponent(rest).replace(/[-_+]+/g, ' ').trim(); } catch (e) { words = ''; }
    if (words && !words.includes('/') && /^[\p{L}\p{N} '&]{2,40}$/u.test(words)) {
      location.replace(base + '?q=' + encodeURIComponent(words));
    }
  })();
</script>
</body>
</html>
